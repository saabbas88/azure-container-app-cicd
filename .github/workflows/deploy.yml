name: Deploy HTML to Azure Container Apps
on:
 push:
   branches:
      - main
env:
  IMAGE_NAME: html-app
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout
       uses: action/checkout@v4

     - name: login to Azure
       uses: azure/login@v1
       with:
         creds: ${{ secret.AZURE_CREDENTIALS }}
      # Use ACR login via Azure CLI (no password needed
      - name: Login to ACR
        run: |
          az acr login --name $(echo $REGISTRY | cut -d'.' -f1)

     - name: Build Image
       run: |
          docker build --platform linux/amd64 -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Image
        run:  |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}

       - name: Deploy to Container Apps
         run: |
           az containerapp update \
             --name mycontt \
             --resource-group rg \
             --image $REGISTRY/$IMAGE_NAME:${{  github.sha }}

             

         
        





          
         

